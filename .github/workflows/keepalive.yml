# Keeps the free Qdrant cluster from being suspended for inactivity (and, optionally, wakes a sleeping free host).
# Add two repository secrets: BACKEND_URL (e.g. https://medhelp-api.onrender.com) and BACKEND_API_KEY.
name: keepalive
on:
  schedule:
    - cron: "*/14 * * * *"  # Monday and Thursday, 06:17 UTC (never more than 4 days apart)
  workflow_dispatch: 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the backend and Qdrant
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 \
            -H "X-API-Key: ${{ secrets.BACKEND_API_KEY }}" \
            "${{ secrets.BACKEND_URL }}/keepalive"
